<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>June Local {{INSTALLER_VERSION}} · server {{VERSION}}</title>
<style>
:root{--bg:#07090d;--card:#11161f;--line:#222b3a;--text:#e6edf7;--dim:#8fa0b8;--ok:#34d399;--amber:#fbbf24;--red:#f87171;--accent:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#152035,var(--bg));color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:880px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);flex:none}
.dot.amber{background:var(--amber);box-shadow:0 0 12px var(--amber)}
.dot.red{background:var(--red);box-shadow:0 0 12px var(--red)}
h1{font-size:24px;margin:0}
.sub{color:var(--dim);margin:2px 0 0;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}
.tile{background:linear-gradient(180deg,#141b26,#0f141d);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-size:19px;font-weight:650;margin-top:4px}
.tile .s{color:var(--dim);font-size:12px;margin-top:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin:10px 0}
summary{cursor:pointer;padding:12px 2px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary:after{content:"▾";float:right;color:var(--dim)}
details[open] summary:after{content:"▴"}
.body{padding:2px 2px 14px;color:var(--dim)}
.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed #1c2431}
.row:last-child{border-bottom:none}
.row b{color:var(--text);font-weight:600}
.ok{color:var(--ok)}.amber{color:var(--amber)}.red{color:var(--red)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.prob{border-left:3px solid var(--amber);background:#1a1608;padding:10px 12px;border-radius:8px;margin:8px 0;color:var(--text)}
.prob.red{border-color:var(--red);background:#1c0f10}
.prob .fix{color:var(--dim);font-size:13px;margin-top:4px}
footer{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:26px;color:var(--dim);font-size:13px}
footer a{color:var(--accent);text-decoration:none}
button{background:#13202f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary{background:#0b4a67;border-color:#16779e}
button:disabled{cursor:not-allowed;opacity:.48}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.field{display:block;margin:10px 0}.field span{display:block;color:var(--text);font-weight:600;margin-bottom:5px}
.field input{width:100%;background:#090d13;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.notice{border:1px solid #24506a;background:#0b1b26;color:var(--text);border-radius:8px;padding:10px 12px;margin:10px 0}
.notice.bad{border-color:#6b2227;background:#1c0f10}
noscript{display:block;background:#1a1608;border:1px solid #4a3b12;padding:12px;border-radius:10px}
</style>
</head>
<body>
<main>
<header>
  <div class="dot {{HEADLINE_CLASS}}" id="dot"></div>
  <div><h1 id="headline">{{HEADLINE}}</h1><p class="sub" id="subline">June Local {{INSTALLER_VERSION}} · server {{VERSION}}</p></div>
</header>
<noscript>
  <p><b>June Local {{INSTALLER_VERSION}} · server {{VERSION}}</b>. JavaScript is off, so this page shows a summary only.
  <a href="/local/status">Open the status JSON</a> or <a href="/local/ca.crt">download the CA</a>.</p>
</noscript>
<section class="tiles" id="tiles"></section>
<section id="problems"></section>
<section id="sections"></section>
<footer>
  <button id="copy">Copy diagnostics</button>
  <a href="/local/status" download="june-local-status.json">Download diagnostics</a>
  <a href="/local/cook.html">Cook view</a>
  <a href="/local/ca.crt">CA certificate</a>
  <a href="https://github.com/prj-july/installer/releases/tag/v{{INSTALLER_VERSION}}">Release notes</a>
  <a href="https://project-july.org/setup">Setup guide</a>
  <a href="https://github.com/prj-july/installer">Repository</a>
  <a href="https://github.com/prj-july/installer/issues/new">Report a problem</a>
</footer>
</main>
<script id="initial-status" type="application/json">{{JSON}}</script>
<script>
const initial = JSON.parse(document.getElementById('initial-status').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secs = s => s < 0 ? 'never' : (s < 60 ? s + ' s ago' : (s < 3600 ? Math.round(s/60) + ' min ago' : Math.round(s/3600) + ' h ago'));
const bytes = n => n > 1e9 ? (n/1e9).toFixed(1)+' GB' : (n > 1e6 ? (n/1e6).toFixed(1)+' MB' : (n > 1e3 ? (n/1e3).toFixed(0)+' KB' : (n||0)+' B'));
let data = initial;
const UPDATE_TOKEN_KEY = 'june-local-update-token';
let updateToken = '';
const userToggled = new Set();
try { updateToken = sessionStorage.getItem(UPDATE_TOKEN_KEY) || ''; } catch (e) {}

function tile(k, v, s, cls) { return `<div class="tile"><div class="k">${esc(k)}</div><div class="v ${cls||''}">${esc(v)}</div><div class="s">${esc(s)}</div></div>`; }
function updateLabel(u) {
  const labels = {
    'ready': 'Ready', 'checking': 'Checking', 'up-to-date': 'Up to date',
    'update-available': 'Update available', 'staged': 'Reboot to apply',
    'error': 'Update error', 'disabled': 'Updates unavailable'
  };
  return labels[u.state] || 'Unknown';
}
function updatesTone(u) {
  if (u.state === 'error') return 'red';
  if (u.state === 'update-available' || u.state === 'staged' || u.state === 'checking') return 'amber';
  return u.enabled ? 'ok' : 'amber';
}
function updateSummary(u) {
  if (u.pending && u.pending.release) return u.pending.release + ' staged';
  if (u.available && u.available.release) return u.available.release + ' available';
  if (u.current_release) return u.current_release + ' installed';
  if (u.enabled) return 'signed HTTPS repository';
  return u.last_error || 'install the updater config';
}
function syncUpdateToken() {
  const input = $('update-token');
  if (input && updateToken) input.value = updateToken;
}
function setUpdateMessage(text, bad) {
  const el = $('update-msg');
  if (!el) return;
  el.hidden = !text;
  el.className = 'notice' + (bad ? ' bad' : '');
  el.textContent = text || '';
}
async function runUpdateAction(action) {
  if (location.protocol !== 'https:') {
    setUpdateMessage('Open this page over HTTPS before sending an update token.', true);
    return;
  }
  const input = $('update-token');
  const token = (input && input.value.trim()) || updateToken;
  if (!token) {
    setUpdateMessage('Enter the update control token printed by the installer.', true);
    if (input) input.focus();
    return;
  }
  if (action === 'stage' && !window.confirm('Stage this signed update for the next oven boot?')) return;
  updateToken = token;
  try { sessionStorage.setItem(UPDATE_TOKEN_KEY, token); } catch (e) {}
  document.querySelectorAll('[data-update]').forEach(b => { b.disabled = true; });
  setUpdateMessage(action === 'check' ? 'Checking the signed repository…' : 'Downloading and verifying the update…', false);
  try {
    const res = await fetch('/local/update/' + action, {
      method: 'POST', cache: 'no-store',
      headers: { 'X-June-Update-Token': token }
    });
    const reply = await res.json().catch(() => ({}));
    if (reply.update) data.update = reply.update;
    render(data);
    if (!res.ok) throw new Error(reply.error || ('HTTP ' + res.status));
    if (action === 'stage') {
      setUpdateMessage('Update verified and staged. Power-cycle the oven when convenient to apply it.', false);
    } else if (reply.update && reply.update.available) {
      setUpdateMessage('A signed update is available. Stage it when you are ready.', false);
    } else {
      setUpdateMessage('This oven is up to date on its selected channel.', false);
    }
  } catch (err) {
    render(data);
    setUpdateMessage((err && err.message) || 'Update request failed.', true);
  }
}
function cookSub(c) {
  c = c || {};
  const bits = [];
  if (c.current_c) bits.push(c.current_c.toFixed(0) + ' °C now');
  else if (c.target_c) bits.push(c.target_c.toFixed(0) + ' °C target');
  if (c.remaining_seconds) {
    const m = Math.floor(c.remaining_seconds / 60), s = Math.round(c.remaining_seconds % 60);
    bits.push(m + ':' + String(s).padStart(2, '0') + ' left');
  }
  if (!bits.length && c.state === 'idle' && c.last_cook) bits.push('previous: ' + (c.last_cook.mode || 'cook') + (c.last_cook.target_c ? ' ' + c.last_cook.target_c.toFixed(0) + ' °C' : ''));
  return bits.join(' · ') || 'no active plan';
}
function row(k, v, cls) { return `<div class="row"><span>${esc(k)}</span><b class="${cls||''}">${esc(v)}</b></div>`; }
function details(id, title, body, open) { return `<details id="${id}" ${open?'open':''}><summary>${esc(title)}</summary><div class="body">${body}</div></details>`; }

function render(d) {
  const worst = (d.problems || []).find(p => p.severity === 'red') || (d.problems || []).find(p => p.severity === 'amber');
  const ident = (d.oven && d.oven.identity) || {};
  const upd = d.update || {};
  const secureUpdate = location.protocol === 'https:';
  const sev = worst ? worst.severity : 'ok';
  $('dot').className = 'dot ' + (sev === 'ok' ? '' : sev);
  $('headline').textContent = worst ? worst.title : 'All good';
  $('subline').textContent = `June Local ${d.install.installer_version || 'unknown'} · server ${d.version.version} (${d.version.commit}) · up ${Math.round(d.version.uptime_seconds/3600)} h`;
  $('tiles').innerHTML =
    tile('Oven', d.oven.connection === 'connected' ? 'Connected' : 'Offline', `last message ${secs(d.oven.last_frame_age_seconds)}`, d.oven.connection === 'connected' ? 'ok' : 'red') +
    tile('Identity', ident.account_present ? 'Present' : 'Missing',
      ident.token_prefix ? `${ident.token_prefix} · ${ident.token_source}` : (ident.token_source === 'none' ? 'no local token' : ident.token_source),
      ident.account_present ? 'ok' : 'red') +
    tile('Cooking', d.cook.state === 'idle' ? 'No cook running' : (d.cook.mode || 'Cooking'), cookSub(d.cook), d.cook.state === 'idle' ? '' : 'ok') +
    tile('Camera', d.camera.camerad_running ? 'Running' : 'Down', `last frame ${secs(d.camera.last_frame_age_seconds)}`, d.camera.last_frame_age_seconds > 20 ? 'amber' : 'ok') +
    tile('Updates', updateLabel(upd), updateSummary(upd), updatesTone(upd)) +
    tile('Installer', (d.install && d.install.installer_version) || 'unknown', (d.install && d.install.build_id) || '') +
    tile('Server', d.version.version, `${d.version.commit} · ${d.version.build_date}`);

  $('problems').innerHTML = (d.problems || []).map(p => `<div class="prob ${p.severity}"><b>${esc(p.title)}</b><div>${esc(p.detail)}</div><div class="fix">${esc(p.fix)}</div></div>`).join('');

  const compsList = d.install.components || [];
  const comps = compsList.map(c => {
    const verified = !!c.expected;
    const mark = verified ? (c.ok ? '✓' : '✗') : '•';
    const hash = c.actual ? c.actual.slice(0,8) : '';
    const note = verified ? (c.expected === c.actual ? '' : ' ≠ ' + c.expected.slice(0,8)) : ' factory (no expected hash)';
    return row(`${mark} ${c.name}`, hash + note, verified ? (c.ok ? 'ok' : 'amber') : 'amber');
  }).join('');
  const presentCount = compsList.filter(c => c.ok).length;
  const verifiedCount = compsList.filter(c => c.expected && c.ok).length;
  const factoryCount = compsList.filter(c => !c.expected).length;
  const clients = (d.clients.items || []).map(c => row(`${c.name} (${c.platform || 'client'})`, `${c.paired ? 'paired' : 'unpaired'} · ${c.connected ? 'connected' : 'idle'} · ${secs(c.last_seen_seconds)}`, c.paired ? 'ok' : 'amber')).join('') || '<p>No paired clients.</p>';
  const cert = row('Subject', d.cert.subject) + row('SANs', (d.cert.sans||[]).join(', ')) + row('Issuer', d.cert.issuer) +
    row('Valid until', `${d.cert.not_after} (${d.cert.days_remaining} days)`, d.cert.days_remaining < 30 ? 'amber' : 'ok') +
    row('Fingerprint', d.cert.fingerprint ? d.cert.fingerprint.slice(0,16) : '') +
    row('CA fingerprint', d.cert.ca_fingerprint ? d.cert.ca_fingerprint.slice(0,16) : '') +
    row('CA in system store', d.cert.ca_in_system_store ? 'yes' : 'no', d.cert.ca_in_system_store ? 'ok' : 'amber') +
    row('Covers current IP', d.cert.san_covers_current_ip ? 'yes' : 'no', d.cert.san_covers_current_ip ? 'ok' : 'amber') +
    `<p><a href="/local/ca.crt">Download CA / chain</a> — check the fingerprint matches the one shown by the installer.</p>`;
  const net = row('IP', (d.network.ips||[]).join(', ')) + row('Hostname', d.network.hostname || '') +
    row('mDNS', d.network.mdns ? `${d.network.mdns} (configured; use the IP if it does not resolve)` : 'not configured') +
    row('Ports', `TLS ${d.network.tls_port} · HTTP ${d.network.http_port}`) + row('Hosts override', d.network.hosts_overrides ? 'yes' : 'no') +
    row('HA client', d.network.ha_client_version || 'not seen') + row('Gateway', d.network.gateway || '') + row('DNS', (d.network.dns||[]).join(', '));
  const storage = row('Data free', d.storage.data_free_pct.toFixed(1) + '%', d.storage.data_free_pct < 10 ? 'amber' : 'ok') +
    row('Collector free', d.storage.collector_free_pct.toFixed(1) + '%', d.storage.collector_free_pct < 10 ? 'amber' : 'ok') +
    row('Log', bytes(d.storage.log_bytes)) + row('JSONL', bytes(d.storage.jsonl_bytes)) + row('Media', bytes(d.storage.media_bytes)) + row('Latest frame', bytes(d.storage.latest_frame_bytes));
  const customFlow = compsList.some(c => c.name === 'Remotes' && c.expected);
  const flow = customFlow ? 'custom (per-home CA + no-pin apps)' : 'basic (factory June apps)';
  const provenance = row('Install', `${flow} · ${d.install.date || ''}`) +
    row('install.json mode', d.install.mode || 'unknown') +
    row('Server', `${d.version.version} · ${d.version.commit} · ${d.version.build_date}`) +
    row('Installer', `${d.install.installer_version || 'unknown'} · ${d.install.build_id || ''}`) +
    row('Persistence', d.install.persistence || '') +
    row('CA issuer', `${d.cert.issuer || 'unknown'} · recorded: ${d.install.ca_mode || 'unknown'}`) +
    row('Hostname', d.install.hostname || '') + row('Install IP', d.install.install_ip || '') + row('Presets', `${d.presets.catalog_entries} entries · ${bytes(d.presets.upstream_bytes)}`);
  const avail = upd.available || {};
  const pending = upd.pending || {};
  const updateState = row('State', updateLabel(upd), updatesTone(upd)) +
    row('Channel', upd.channel || 'not configured') +
    row('Installed release', upd.current_release || 'installer baseline') +
    row('Last checked', upd.last_checked_at || 'never') +
    (pending.release ? row('Staged release', `${pending.release} · reboot required`, 'amber') : '') +
    (pending.artifact_sha256 ? row('Staged SHA-256', pending.artifact_sha256.slice(0,16)) : '') +
    (avail.release ? row('Available release', `${avail.release} · ${bytes(avail.artifact_size)}`, 'amber') : '') +
    (avail.artifact_sha256 ? row('Artifact SHA-256', avail.artifact_sha256.slice(0,16)) : '') +
    (avail.notes ? `<div class="notice"><b>${esc(avail.release)}</b><br>${esc(avail.notes)}</div>` : '') +
    (upd.last_error ? `<div class="notice bad"><b>Update error</b><br>${esc(upd.last_error)}</div>` : '') +
    (pending.release ? `<div class="notice"><b>Ready for the next boot.</b> Power-cycle the oven normally. The boot applier backs up the live Chef APK, verifies the staged copy, and retains the previous APK for rollback.</div>` : '') +
    (!secureUpdate ? `<div class="notice bad"><b>HTTPS is required for update controls.</b> The control token must not cross the LAN in plaintext. <a href="https://${esc(location.hostname)}/local">Open the secure status page</a>.</div>` : '') +
    `<p>Updates are pulled over HTTPS from the signed repository. The oven verifies the Ed25519 manifest and the APK SHA-256 before staging anything.</p>` +
    `<label class="field"><span>Update control token</span><input id="update-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Printed by the installer"></label>` +
    `<div class="actions"><button type="button" data-update="check" ${upd.enabled && secureUpdate ? '' : 'disabled'}>Check for update</button>` +
    `<button class="primary" type="button" data-update="stage" ${upd.enabled && secureUpdate && avail.release && !pending.release ? '' : 'disabled'}>Stage for next boot</button></div>` +
    `<div id="update-msg" class="notice" hidden></div>` +
    `<p class="mono">Installer log / USB: /june-logs/update-token.txt<br>Oven file: /data/june/updates/control-token</p>`;
  const cam = row('june-camerad', d.camera.camerad_running ? 'running' : 'stopped', d.camera.camerad_running ? 'ok' : 'red') +
    row('Stock socket', d.camera.stock_socket ? 'present' : 'missing', d.camera.stock_socket ? 'ok' : 'amber') + row('Viewer gate', d.camera.viewer_gate ? 'open' : 'closed') +
    row('Last frame', secs(d.camera.last_frame_age_seconds)) + row('Light helper', d.light.helper_installed ? 'installed' : 'missing', d.light.helper_installed ? 'ok' : 'amber') +
    row('Light scene', d.light.scene_on ? 'on' : 'off') + row('Last light result', d.light.last_result || 'none');
  // The June account row is what the oven's app reads for its bearer token.
  // A factory reset wipes it; only the pre-Android boot ensure can put it back,
  // so this section is the first thing support needs for a "connected" oven
  // that never connects.
  const identity = row('June account row', ident.account_present ? 'present' : 'missing', ident.account_present ? 'ok' : 'red') +
    row('Account name', ident.account_name || (ident.account_present ? 'unreadable' : '—')) +
    row('Token type', ident.token_type || '—') +
    row('Token source', ident.token_source || 'none') +
    row('Token prefix', ident.token_prefix || '—') +
    `<p>Read from <span class="mono">/data/system/users/0/accounts.db</span> and <span class="mono">/data/june/identity.json</span>. ` +
    `The full token is never shown. A <b>factory reset</b> wipes this row; it is re-created by the boot-time identity ensure from the installer seed on the next boot. ` +
    `june-local cannot create it at runtime — if it stays missing after a reboot, reinstall from the current USB image and check /data/june/logs/identity.log.</p>`;
  // Re-rendering replaces the sections, so carry over what the reader was
  // doing: which sections are open, the token being typed (and its focus),
  // and the last update message.
  const wasOpen = {};
  document.querySelectorAll('#sections details').forEach(el => { wasOpen[el.id] = el.open; });
  const oldInput = $('update-token');
  const typed = oldInput ? oldInput.value : '';
  const hadFocus = !!oldInput && document.activeElement === oldInput;
  const caret = hadFocus ? [oldInput.selectionStart, oldInput.selectionEnd] : null;
  const oldMsg = $('update-msg');
  const msgState = oldMsg && !oldMsg.hidden ? { text: oldMsg.textContent, bad: oldMsg.classList.contains('bad') } : null;
  $('sections').innerHTML = details('sec-install','Install & components',comps + row('Summary', `${presentCount}/${compsList.length} present · ${verifiedCount} hash-verified · ${factoryCount} factory`)) +
    details('sec-identity','Local identity',identity) +
    details('sec-clients','Clients & pairing',clients) +
    details('sec-camera','Camera & light',cam) +
    details('sec-update','Software updates',updateState) +
    details('sec-cert','Certificate',cert) +
    details('sec-network','Network',net) +
    details('sec-storage','Storage',storage) +
    details('sec-provenance','Provenance',provenance) +
    details('sec-errors','Recent errors',(d.errors||[]).map(e=>row(e.time, `${e.source}: ${e.message}`)).join('') || '<p>None.</p>');

  const open = {}; (d.problems||[]).forEach(p => { const m = { 'oven-disconnected':'sec-network','identity-missing':'sec-identity','cert-untrusted':'sec-cert','factory-fallback':'sec-install','camera-bridge':'sec-camera','light-bridge':'sec-camera','cert-expiry':'sec-cert','cert-ip-mismatch':'sec-cert','storage-low':'sec-storage' }; if (m[p.id]) open[m[p.id]] = 1; });
  if (upd.state === 'update-available' || upd.state === 'staged' || upd.state === 'error') open['sec-update'] = 1;
  // A section the reader opened or closed keeps that state; the others keep
  // their previous state and open when a problem points at them.
  document.querySelectorAll('#sections details').forEach(el => {
    el.open = userToggled.has(el.id) ? !!wasOpen[el.id] : (!!wasOpen[el.id] || !!open[el.id]);
  });
  syncUpdateToken();
  const newInput = $('update-token');
  if (newInput && typed) newInput.value = typed;
  if (newInput && hadFocus) {
    newInput.focus();
    try { newInput.setSelectionRange(caret[0], caret[1]); } catch (e) {}
  }
  if (msgState) setUpdateMessage(msgState.text, msgState.bad);
}

function refresh() { fetch('/local/status', {cache:'no-store'}).then(r=>r.json()).then(j=>{data=j;render(j);}).catch(()=>{}); }
function copyText(txt) {
  // navigator.clipboard is only available in a secure context. /local is
  // normally opened over plain HTTP on the oven's LAN IP, so fall back to the
  // old textarea + execCommand path there instead of silently doing nothing.
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(txt);
  }
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok ? Promise.resolve() : Promise.reject(new Error('copy unavailable'));
}
$('copy').addEventListener('click', () => {
  const txt = '```json\n' + JSON.stringify(data, null, 2) + '\n```';
  copyText(txt).then(() => {
    $('copy').textContent = 'Copied';
    setTimeout(() => { $('copy').textContent = 'Copy diagnostics'; }, 1500);
  }).catch(() => {
    $('copy').textContent = 'Copy failed — use Download diagnostics';
    setTimeout(() => { $('copy').textContent = 'Copy diagnostics'; }, 3500);
  });
});
$('sections').addEventListener('click', (event) => {
  const summary = event.target.closest('summary');
  if (summary && summary.parentElement) userToggled.add(summary.parentElement.id);
  const button = event.target.closest('[data-update]');
  if (button) runUpdateAction(button.getAttribute('data-update'));
});
render(initial);
setInterval(()=>{ if(!document.hidden) refresh(); }, 7000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });
</script>
</body>
</html>
