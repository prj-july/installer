<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>June oven cook</title>
<style>
:root{--bg:#07090d;--card:#11161f;--line:#222b3a;--text:#e6edf7;--dim:#8fa0b8;--ok:#34d399;--amber:#fbbf24;--red:#f87171;--accent:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#152035,var(--bg));color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);flex:none}
.dot.idle{background:var(--dim);box-shadow:none}
.dot.preheating,.dot.cooking{background:var(--amber);box-shadow:0 0 12px var(--amber)}
.dot.offline{background:var(--red);box-shadow:0 0 12px var(--red)}
h1{font-size:24px;margin:0}
.sub{color:var(--dim);margin:2px 0 0;font-size:13px}
.hero{background:linear-gradient(180deg,#141b26,#0f141d);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center;margin:18px 0}
.hero .temp{font-size:72px;font-weight:650;letter-spacing:-.03em;line-height:1}
.hero .unit{font-size:28px;color:var(--dim);font-weight:500}
.hero .target{color:var(--dim);margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{background:linear-gradient(180deg,#141b26,#0f141d);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-size:22px;font-weight:650;margin-top:4px}
footer{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px;color:var(--dim);font-size:13px}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<main>
<header>
  <div class="dot" id="dot"></div>
  <div><h1 id="headline">June oven</h1><p class="sub" id="subline">Cook status</p></div>
</header>
<section class="hero">
  <div class="temp"><span id="temp">--</span><span class="unit"> °C</span></div>
  <div class="target" id="target">no target</div>
</section>
<section class="tiles">
  <div class="tile"><div class="k">State</div><div class="v" id="state">idle</div></div>
  <div class="tile"><div class="k">Mode</div><div class="v" id="mode">—</div></div>
  <div class="tile"><div class="k">Timer</div><div class="v" id="timer">—</div></div>
  <div class="tile"><div class="k">Door</div><div class="v" id="door">—</div></div>
</section>
<footer>
  <a href="/local">June Local status</a>
  <a href="/local/cook.json">JSON</a>
  <a href="/media/view">Camera</a>
</footer>
</main>
<script>
const $ = id => document.getElementById(id);
function fmtTemp(n){ return (n == null || n === 0) ? '--' : (Math.round(n*10)/10).toFixed(n % 1 ? 1 : 0); }
function fmtTimer(s){
  if (!s) return '—';
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), r = s % 60;
  return m + ':' + String(r).padStart(2,'0');
}
function render(d){
  const connected = !!d.oven_connected;
  const state = d.state || 'idle';
  $('dot').className = 'dot ' + (connected ? state : 'offline');
  $('headline').textContent = connected ? (state === 'idle' ? 'Idle' : (d.mode || state)) : 'Oven offline';
  $('subline').textContent = d.updated_at ? ('Updated ' + d.updated_at) : 'Cook status';
  $('temp').textContent = fmtTemp(d.current_c);
  $('target').textContent = d.target_c ? ('target ' + fmtTemp(d.target_c) + ' °C') : 'no target';
  $('state').textContent = state;
  $('mode').textContent = d.mode || '—';
  $('timer').textContent = fmtTimer(d.remaining_seconds);
  $('door').textContent = d.door_open == null ? '—' : (d.door_open ? 'Open' : 'Closed');
}
function refresh(){ fetch('/local/cook.json', {cache:'no-store'}).then(r=>r.json()).then(render).catch(()=>{}); }
render({{JSON}});
setInterval(()=>{ if(!document.hidden) refresh(); }, 2000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });
</script>
</body>
</html>
