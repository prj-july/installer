<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Connect by name · options</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Reach the oven as june.local, june2.local or june3.local</text><rect x="1370" y="48" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1411.5" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><circle cx="130" cy="210" r="16" fill="#ff7a2e"/><text x="130" y="216" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#160a04" text-anchor="middle" >1</text><text x="158" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#f4f4f5" text-anchor="start" >Options</text><circle cx="340" cy="210" r="16" fill="#3a3f47"/><text x="340" y="216" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#160a04" text-anchor="middle" >2</text><text x="368" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >Connect oven</text><circle cx="550" cy="210" r="16" fill="#3a3f47"/><text x="550" y="216" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#160a04" text-anchor="middle" >3</text><text x="578" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >Install</text><text x="130" y="300" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="300" fill="#f4f4f5" text-anchor="start" >Install June Local on this oven</text><text x="130" y="350" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" >Adds the project CA to the oven&#x27;s trust store, so the factory June apps talk</text><text x="130" y="381" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" >to June Local instead of June&#x27;s cloud. The JuneDns helper advertises the name;</text><text x="130" y="412" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" >if multicast is blocked, add a local DNS entry or use Connect by IP. Install</text><text x="130" y="443" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" >the same CA on the phone afterwards.</text><rect x="130" y="440" width="1340" height="120" rx="14" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="160" y="475" width="34" height="34" rx="6" fill="#0f1115" stroke="#2a2e35" stroke-width="1.5" /><text x="220" y="500" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#f4f4f5" text-anchor="start" >Keep June Local after a factory reset</text><text x="220" y="532" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Off by default. Stores the June Local patches in /system so a factory reset keeps them.</text><rect x="1360" y="486" width="97" height="28" rx="14.0" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1408.5" y="504" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#ffb04a" text-anchor="middle" >OPTIONAL</text><rect x="130" y="620" width="330" height="62" rx="12" fill="#ff7a2e" stroke="#2a2e35" stroke-width="1.5" /><text x="295" y="660" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#160a04" text-anchor="middle" >Next: connect the oven</text><rect x="490" y="620" width="170" height="62" rx="12" fill="#0f1115" stroke="#2a2e35" stroke-width="1.5" /><text x="575" y="660" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle" >Back</text><rect x="130" y="720" width="1340" height="100" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="130" y="720" width="7" height="100" rx="3.5" fill="#4ade80"/><text x="150" y="757.6" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" text-anchor="start" >What this does</text><text x="150" y="797.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Adds the project CA, the local server, the camera bridge and JuneDns. Install the same CA on your phone.</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >Connect by IP is the recommended path; Connect by name is for a name instead of an IP.</text></svg>
