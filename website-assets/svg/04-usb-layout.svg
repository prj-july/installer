<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >What is on the stick</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Two Ventoy partitions; the large one is the June Local data partition</text><rect x="120" y="210" width="1360" height="180" rx="24" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="150" y="245" width="300" height="110" rx="16" fill="#1d2128" stroke="#2a2e35" stroke-width="1.5" /><text x="300" y="290" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#f4f4f5" text-anchor="middle" >VTOYEFI</text><text x="300" y="325" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="middle" >32 MB · FAT · do not touch</text><rect x="470" y="235" width="980" height="130" rx="16" fill="#1b2418" stroke="#31512c" stroke-width="1.5" /><text x="960" y="282" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#4ade80" text-anchor="middle" >Ventoy</text><text x="960" y="320" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="middle" >exFAT · keep the label · visible in Windows/Linux</text><rect x="120" y="460" width="430" height="120" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="120" y="460" width="7" height="120" rx="3.5" fill="#ff7a2e"/><text x="140" y="498.4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#f4f4f5" text-anchor="start" >june-local-live.iso</text><text x="140" y="538.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >≈ 1.4 GB · boot image</text><rect x="590" y="460" width="430" height="120" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="590" y="460" width="7" height="120" rx="3.5" fill="#ffb04a"/><text x="610" y="498.4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#f4f4f5" text-anchor="start" >ventoy/ventoy.json</text><text x="610" y="538.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >auto-select the ISO</text><rect x="1060" y="460" width="430" height="120" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="1060" y="460" width="7" height="120" rx="3.5" fill="#7cc4f2"/><text x="1080" y="498.4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#f4f4f5" text-anchor="start" >june-logs/</text><text x="1080" y="538.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >installer logs</text><rect x="120" y="610" width="430" height="120" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="120" y="610" width="7" height="120" rx="3.5" fill="#4ade80"/><text x="140" y="648.4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#f4f4f5" text-anchor="start" >june-certs/</text><text x="140" y="688.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >per-home CA + leaf</text><rect x="590" y="610" width="430" height="120" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="590" y="610" width="7" height="120" rx="3.5" fill="#fbbf24"/><text x="610" y="648.4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#f4f4f5" text-anchor="start" >free space</text><text x="610" y="688.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >≥ 8 GB for one ~7.3 GB oven backup</text><rect x="120" y="730" width="1360" height="90" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="120" y="730" width="7" height="90" rx="3.5" fill="#e05252"/><text x="140" y="768.4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#f4f4f5" text-anchor="start" >Never FAT32</text><text x="140" y="808.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >FAT32 cannot store the ~7.3 GB oven backup. Use the Ventoy exFAT default or NTFS.</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >16 GB minimum · 32 GB recommended if the same stick will hold a backup</text></svg>
