<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Connect by IP vs Connect by name</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Pick Connect by IP unless you want to reach the oven by name</text><rect x="90" y="200" width="680" height="420" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="90" y="200" width="7" height="420" rx="3.5" fill="#ff7a2e"/><text x="116" y="250.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#f4f4f5" text-anchor="start" >Connect by IP</text><text x="116" y="290.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Recommended. Creates a per-home certificate authority on</text><text x="116" y="318.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >the USB and a certificate that includes the oven&#x27;s LAN IP.</text><text x="116" y="346.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >No hostname or DNS to set up. Install the CA on the phone</text><text x="116" y="374.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >and use the oven&#x27;s IP.</text><rect x="830" y="200" width="680" height="420" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="830" y="200" width="7" height="420" rx="3.5" fill="#ffb04a"/><text x="856" y="250.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#f4f4f5" text-anchor="start" >Connect by name (june.local)</text><text x="856" y="290.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Adds the project CA to the oven&#x27;s trust store. The JuneDns</text><text x="856" y="318.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >helper advertises june.local, june2.local or june3.local;</text><text x="856" y="346.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >if multicast is blocked, add a local DNS entry or use</text><text x="856" y="374.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Connect by IP. Install the same CA on the phone.</text><rect x="90" y="660" width="1420" height="120" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><text x="130" y="710" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#f4f4f5" text-anchor="start" >Persistence option</text><text x="130" y="750" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >Off by default. Turn it on to keep June Local after a factory reset; it stores the patches in /system.</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >Most users should choose Connect by IP.</text></svg>
