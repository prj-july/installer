<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >June Local installer UI</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Faithful mockup from the real GUI copy and color system</text><rect x="1370" y="48" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1411.5" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><rect x="70" y="160" width="1460" height="660" rx="20" fill="#0b0d10" stroke="#2a2e35" stroke-width="1.5" /><rect x="70" y="160" width="1460" height="70" rx="20" fill="#0f1115"/><rect x="70" y="200" width="1460" height="30" fill="#0f1115"/><circle cx="120" cy="195" r="18" fill="#ff7a2e"/><text x="152" y="188" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#f4f4f5" text-anchor="start" >Project July</text><text x="152" y="214" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start" >June Local installer 0.8 · build 20261024-1602-b5ca5293</text><rect x="1320" y="178" width="149" height="28" rx="14.0" fill="#243229" stroke="#243229" stroke-width="0" /><text x="1394.5" y="196" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle" >OVEN CONNECTED</text><text x="100" y="300" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="300" fill="#f4f4f5" text-anchor="start" >What would you like to do?</text><rect x="100" y="340" width="330" height="260" rx="18" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><circle cx="150" cy="390" r="26" fill="#ff7a2e"/><text x="190" y="400" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5" text-anchor="start" >Connect by IP</text><text x="124" y="460" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start" >No hostname or DNS needed. A</text><text x="124" y="483" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start" >per-home CA and a certificate for</text><text x="124" y="506" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start" >the oven&#x27;s IP.</text><rect x="320" y="360" width="109" height="26" rx="13.0" fill="#3a2416" stroke="#3a2416" stroke-width="0" /><text x="374.5" y="376" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#ffb04a" text-anchor="middle" >RECOMMENDED</text><rect x="460" y="340" width="330" height="260" rx="18" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><circle cx="510" cy="390" r="26" fill="#ffb04a"/><text x="550" y="400" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5" text-anchor="start" >Connect by name</text><text x="484" y="460" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start" >Adds the project CA. JuneDns</text><text x="484" y="483" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start" >advertises june.local.</text><rect x="820" y="340" width="330" height="260" rx="18" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><circle cx="870" cy="390" r="26" fill="#7cc4f2"/><text x="910" y="400" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5" text-anchor="start" >Back up the oven</text><text x="844" y="460" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start" >A full copy of the oven&#x27;s storage on</text><text x="844" y="483" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start" >a USB drive. 15 to 30 minutes.</text><rect x="1180" y="340" width="330" height="260" rx="18" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><circle cx="1230" cy="390" r="26" fill="#4ade80"/><text x="1270" y="400" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5" text-anchor="start" >Restore a backup</text><text x="1204" y="460" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start" >Puts a backup image back on the</text><text x="1204" y="483" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start" >oven.</text><text x="100" y="680" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Each job asks you to put the oven in recovery mode first. Nothing changes until you press the final button.</text><rect x="100" y="720" width="300" height="56" rx="12" fill="#0f1115" stroke="#2a2e35" stroke-width="1.5" /><text x="250" y="756" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#f4f4f5" text-anchor="middle" >Use your phone instead</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >Real screenshots can also be taken from the phone UI: open the QR link while the installer is running.</text></svg>
