<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Job finished</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >The next steps depend on the job</text><rect x="1370" y="48" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1411.5" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><text x="130" y="250" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="300" fill="#4ade80" text-anchor="start" >June Local is installed</text><text x="130" y="300" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" >Done · 2:14</text><rect x="130" y="350" width="1340" height="16" rx="8" fill="#4ade80" stroke="#2a2e35" stroke-width="1.5" /><circle cx="160" cy="424" r="10" fill="#ff7a2e"/><text x="190" y="430" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#f4f4f5" text-anchor="start" >Unplug the oven&#x27;s power and the USB cable.</text><circle cx="160" cy="499" r="10" fill="#ff7a2e"/><text x="190" y="505" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#f4f4f5" text-anchor="start" >Wait 10 seconds, plug the power back in and let the oven start normally.</text><circle cx="160" cy="574" r="10" fill="#ff7a2e"/><text x="190" y="580" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#f4f4f5" text-anchor="start" >From a device on the same network, open http://&lt;oven-ip&gt;/local. You should see the</text><text x="190" y="610" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#f4f4f5" text-anchor="start" >June Local status page.</text><circle cx="160" cy="649" r="10" fill="#ff7a2e"/><text x="190" y="655" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#f4f4f5" text-anchor="start" >On the phone, install the CA from http://&lt;oven-ip&gt;/local/ca.crt, then pair from the</text><text x="190" y="685" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#f4f4f5" text-anchor="start" >June app or Home Assistant.</text><rect x="130" y="780" width="260" height="58" rx="12" fill="#ff7a2e" stroke="#2a2e35" stroke-width="1.5" /><text x="260" y="818" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#160a04" text-anchor="middle" >Done</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >Connect by name uses the project CA; Connect by IP uses the per-home CA on the USB.</text></svg>
