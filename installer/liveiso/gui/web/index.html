<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#08090b">
<title>June Local Installer</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Icon sprite from the Project July website (prj-july/website, public/index.html):
     the mark (the June oven, also the Install tile) and i-key, i-phone, i-check are the design-system set; i-sliders is drawn to
     match (24px grid, 1.75 stroke, round caps); i-backup and i-restore (48x24) show the
     June oven and a USB stick with an arrow between them.
     Use with <svg><use href="#i-name"/></svg>; the icons take currentColor. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-mark" viewBox="0 0 64 64" fill="currentColor"><path fill-rule="evenodd" d="M11 12H53A7 7 0 0 1 60 19V41A7 7 0 0 1 53 48H11A7 7 0 0 1 4 41V19A7 7 0 0 1 11 12ZM13.25 16.5H50.75A1.25 1.25 0 0 1 52 17.75V17.75A1.25 1.25 0 0 1 50.75 19H13.25A1.25 1.25 0 0 1 12 17.75V17.75A1.25 1.25 0 0 1 13.25 16.5ZM13.5 23H50.5A3.5 3.5 0 0 1 54 26.5V39.5A3.5 3.5 0 0 1 50.5 43H13.5A3.5 3.5 0 0 1 10 39.5V26.5A3.5 3.5 0 0 1 13.5 23Z"/><path d="M46.25 28.5H50.25A1.25 1.25 0 0 1 51.5 29.75V39.25A1.25 1.25 0 0 1 50.25 40.5H46.25A1.25 1.25 0 0 1 45 39.25V29.75A1.25 1.25 0 0 1 46.25 28.5ZM10.5 48H16.5A1.5 1.5 0 0 1 18 49.5V50A1.5 1.5 0 0 1 16.5 51.5H10.5A1.5 1.5 0 0 1 9 50V49.5A1.5 1.5 0 0 1 10.5 48ZM47.5 48H53.5A1.5 1.5 0 0 1 55 49.5V50A1.5 1.5 0 0 1 53.5 51.5H47.5A1.5 1.5 0 0 1 46 50V49.5A1.5 1.5 0 0 1 47.5 48Z"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="3.5"/><path d="m10.5 13 8-8"/><path d="m16 7.5 2.5 2.5"/><path d="m13.5 10 2 2"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="3" width="11" height="18" rx="2.5"/><path d="M10.5 17.5h3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.4 2.4 4.6-4.8"/></symbol>
    <symbol id="i-backup" viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-mark" x="0" y="3" width="18" height="18" stroke="none"/><path d="M19.5 12h7.5"/><path d="m23.75 8.75 3.25 3.25-3.25 3.25"/><rect x="33.5" y="8" width="13" height="8" rx="2"/><rect x="29.5" y="9.5" width="4" height="5" rx=".75"/><path d="M31.25 11.25h.5M31.25 12.75h.5"/></symbol>
    <symbol id="i-restore" viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="8" width="13" height="8" rx="2"/><rect x="14.5" y="9.5" width="4" height="5" rx=".75"/><path d="M16.25 11.25h.5M16.25 12.75h.5"/><path d="M21 12h7.5"/><path d="m25.25 8.75 3.25 3.25-3.25 3.25"/><use href="#i-mark" x="30" y="3" width="18" height="18" stroke="none"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h2.5"/><circle cx="9" cy="8" r="2.5"/><path d="M11.5 8H20"/><path d="M4 16h8.5"/><circle cx="15" cy="16" r="2.5"/><path d="M17.5 16H20"/></symbol>
  </defs>
</svg>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-mark"/></svg>
      <div class="brand-text">
        <div class="brand-name">Project July</div>
        <div class="brand-sub" id="brand-sub">June Local installer</div>
      </div>
    </div>
    <div class="top-right">
      <div class="chip" id="oven-chip" role="status" aria-live="polite"></div>
      <button class="icon-btn" id="phone-btn" type="button" aria-label="Connect a phone" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-phone"/></svg>
        <span class="icon-btn-label">Phone</span>
        <span class="badge" id="phone-badge" hidden></span>
      </button>
    </div>
  </header>
  <main class="main" id="main" tabindex="-1"></main>
  <div class="conn" id="conn" hidden>Reconnecting to the installer…</div>
</div>
<dialog class="sheet" id="sheet"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
